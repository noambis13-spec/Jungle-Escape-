<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jungle Escape</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout concept: full-bleed WebGL temple behind a thin HUD; stone-and-gold UI plates over jungle night. */
:root{
  --bg:#06100c; --panel:rgba(9,20,15,.86); --panel2:rgba(20,38,28,.9);
  --fg:#e9f2e3; --muted:#93ab9c; --gold:#e8bb4c; --gold2:#a87a1f;
  --moss:#5fb06c; --water:#72d6d8; --danger:#e5534b; --line:rgba(232,187,76,.35);
  --f-display:'Cinzel','Rubik',Georgia,serif; --f-body:'Rubik','Segoe UI',system-ui,sans-serif;
  --gx:max(16px,env(safe-area-inset-left,0px)); --gy:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px}
body{touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.btn{background:linear-gradient(180deg,#2c4a35,#18301f);border:1px solid var(--line);border-radius:10px;padding:12px 18px;min-height:46px;font-weight:700;letter-spacing:.02em;color:var(--fg);box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.btn:hover{border-color:var(--gold);filter:brightness(1.15)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(180deg,#f0c75a,#b8841f);color:#2a1a00;border-color:#ffe08a;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.btn.danger{background:linear-gradient(180deg,#8a2b26,#561612)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ibtn{width:46px;height:46px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;padding:0;position:relative}
.ibtn:hover{border-color:var(--gold)}
.ibtn .badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--gold);color:#2a1a00;font-size:11px;font-weight:700;border-radius:9px;padding:1px 5px;min-width:18px;text-align:center}
[hidden]{display:none!important}

/* ===== lobby ===== */
#lobby{position:fixed;inset:0;display:grid;place-items:center;padding:calc(64px + env(safe-area-inset-top,0px)) var(--gy) calc(16px + env(safe-area-inset-bottom,0px)) var(--gx);overflow:auto;touch-action:pan-y;background:radial-gradient(ellipse at 50% 40%,rgba(3,12,8,.25),rgba(3,10,7,.78) 78%)}
.lcard{width:min(760px,100%);background:linear-gradient(180deg,rgba(10,24,17,.78),rgba(6,14,10,.88));border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,30px);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.03);text-align:center}
.ltitle{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6.2vw,54px);line-height:1.1;margin:0;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 24px rgba(232,187,76,.35),0 3px 0 #3a2603;text-wrap:balance}
.lsub{margin:6px 0 18px;color:var(--water);font-size:clamp(15px,3vw,20px);letter-spacing:.04em}
.linfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 20px;padding:0;text-align:start}
.linfo div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px 12px;min-width:0}
.linfo dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.linfo dd{margin:2px 0 0;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.lbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.lbtns .btn{flex:1 1 170px}
.lbtns .start{flex-basis:100%;font-size:20px;min-height:58px}

/* ===== HUD ===== */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#top{position:absolute;top:0;inset-inline:0;padding:calc(8px + env(safe-area-inset-top,0px)) calc(var(--gy) + 160px) 0 var(--gx);display:flex;flex-direction:column;gap:6px;pointer-events:none}
html[dir=rtl] #top{padding:calc(8px + env(safe-area-inset-top,0px)) var(--gy) 0 calc(var(--gx) + 160px)}
#roomname{font-family:var(--f-display);font-weight:800;font-size:clamp(15px,2.6vw,22px);color:var(--gold);text-shadow:0 2px 6px #000;letter-spacing:.04em}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--gold)}
#tr{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));inset-inline-end:var(--gy);display:flex;gap:6px;z-index:30}
html[dir=rtl] #tr{inset-inline-end:var(--gx)}
#bottom{position:absolute;bottom:0;inset-inline:0;padding:0 var(--gy) calc(8px + env(safe-area-inset-bottom,0px)) var(--gx);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#inv{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px;pointer-events:auto;max-width:100%}
.slot-i{width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.35);display:grid;place-items:center;position:relative;font-size:22px;filter:grayscale(1) brightness(.4)}
.slot-i.have{filter:none;border-color:var(--gold);box-shadow:0 0 10px rgba(232,187,76,.35)}
.slot-i.used{filter:grayscale(.6) brightness(.7);border-color:var(--muted)}
.slot-i.used::after{content:"✓";position:absolute;bottom:-3px;inset-inline-end:-3px;background:var(--moss);color:#031;border-radius:50%;width:16px;height:16px;font-size:11px;display:grid;place-items:center;font-weight:700}
.slot-i svg{width:30px;height:30px}
.slot-i.torch{filter:none;border-color:#f08a2e}
.nav{position:absolute;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:24px;display:grid;place-items:center;padding:0;opacity:.85}
#navL{left:var(--gx)}#navR{right:var(--gy)}
#toast{position:absolute;top:calc(92px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));background:var(--panel2);border:1px solid var(--gold);border-radius:12px;padding:10px 16px;text-align:center;font-weight:500;pointer-events:none;opacity:0;transition:opacity .25s;z-index:25;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#toast.on{opacity:1}
#toast.bad{border-color:var(--danger);color:#ffd6d2}
#tip{position:fixed;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;z-index:20;transform:translate(14px,14px);white-space:nowrap}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:40}
#flash.red{background:radial-gradient(circle,rgba(229,83,75,.1),rgba(229,30,20,.7));animation:fl .6s}
#flash.gold{background:radial-gradient(circle,rgba(255,236,150,.8),rgba(232,187,76,.15));animation:fl 1s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .7s;z-index:45}
#fade.on{opacity:1}

/* ===== modal ===== */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) var(--gy) calc(12px + env(safe-area-inset-bottom,0px)) var(--gx);background:rgba(2,8,5,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);touch-action:pan-y}
#mcard{width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#14281d,#0a170f);border:1px solid var(--gold2);border-radius:16px;box-shadow:0 24px 80px #000,0 0 0 1px rgba(255,255,255,.04) inset}
#mcard.wide{width:min(860px,100%)}
#mhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
#mtitle{flex:1;margin:0;font-family:var(--f-display);font-size:clamp(16px,3vw,21px);color:var(--gold);letter-spacing:.03em}
#mbody{padding:14px 16px;overflow:auto;flex:1;min-height:0;touch-action:pan-y;line-height:1.5}
#mfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
#mfoot:empty{display:none}
.say{display:flex;align-items:center;gap:8px;margin-inline-end:auto}
.say input[type=range]{width:90px;accent-color:var(--gold)}
.paper{background:#e6d6a8;color:#3a2a10;border-radius:6px;padding:16px 18px;font-family:'Rubik',serif;font-size:17px;line-height:1.6;box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 0 40px rgba(120,80,20,.25);transform:rotate(-.6deg)}
.paper h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7a5a20}
.hint-line{color:var(--water);margin-top:10px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.big{font-size:22px;font-weight:700}

/* settings / lang */
.menu{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));inset-inline-end:var(--gy);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;z-index:35;display:flex;flex-direction:column;gap:6px;min-width:200px;box-shadow:0 12px 40px #000}
html[dir=rtl] .menu{inset-inline-end:var(--gx)}
.menu button.opt{background:transparent;border:1px solid transparent;border-radius:8px;padding:10px 12px;text-align:start;min-height:44px}
.menu button.opt:hover,.menu button.opt.on{border-color:var(--gold);background:rgba(232,187,76,.12)}
.menu label{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.menu input[type=range]{width:100%;accent-color:var(--gold)}

/* win */
#win{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 30%,rgba(255,230,150,.35),rgba(6,16,12,.88) 70%);text-align:center;overflow:auto}
#win h1{font-family:var(--f-display);font-size:clamp(30px,8vw,64px);color:var(--gold);margin:0 0 10px;text-shadow:0 0 30px rgba(255,220,120,.7),0 3px 0 #3a2603}
#win .stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
#win .stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-size:18px;min-width:120px}
#win .stats small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
@media (max-width:560px){
  .ibtn{width:42px;height:42px}
  #top{padding-inline-end:calc(var(--gy) + 150px)}
  .chip{font-size:12px;padding:3px 8px}
  .slot-i{width:34px;height:34px;font-size:17px}.slot-i svg{width:22px;height:22px}
}
@media (prefers-reduced-motion:reduce){#flash{animation:none!important}#fade{transition:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* chest + notebook */
.cslot{width:58px;height:72px;border-radius:10px;border:2px solid var(--gold2);background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:34px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.cslot.on{border-color:var(--gold);box-shadow:0 0 14px rgba(232,187,76,.5)}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:0 auto}
.num{padding:10px 0;font-size:22px;min-height:54px}
.cgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cbtn{width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.55);box-shadow:inset 0 -6px 12px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.5);display:grid;place-items:end center;padding-bottom:6px;font-size:11px;font-weight:700;color:#111;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.cbtn:active{transform:scale(.94)}
.nbh{margin:6px 0;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.nbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:12px}
.nbn{padding:8px;min-height:44px}.nbn.off{opacity:.35}
.disc{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.disc small{color:var(--muted)}.disc .dv{font-size:22px;font-weight:700;color:var(--gold);letter-spacing:.08em;margin-top:2px}
.dots{display:flex;gap:6px;margin-top:6px}.dots i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:block}
.mdesc{margin:0 0 10px;color:var(--muted)}
.msg{min-height:26px;font-weight:700;text-align:center;margin:8px 0}
.msg.bad{color:#ff9b94}.msg.good{color:#9fe6a8}
.digits-out{display:flex;gap:10px;justify-content:center;margin:10px 0}
.digits-out b{width:54px;height:68px;border:2px solid var(--gold);border-radius:10px;display:grid;place-items:center;font-size:36px;color:var(--gold);background:rgba(0,0,0,.5);text-shadow:0 0 16px rgba(232,187,76,.8);animation:pop .6s both}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
/* M4 memory stones */
.stones{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:380px;margin:10px auto}
.stone{aspect-ratio:1;border-radius:46% 54% 50% 50%;border:3px solid rgba(0,0,0,.4);box-shadow:inset 0 -10px 18px rgba(0,0,0,.4),0 4px 10px rgba(0,0,0,.5);opacity:.55;transition:opacity .15s,transform .15s,box-shadow .15s;min-height:72px}
.stone.lit{opacity:1;transform:scale(1.07);box-shadow:0 0 30px 8px currentColor,inset 0 -10px 18px rgba(0,0,0,.2)}
.stone:disabled{cursor:default}
/* M5 pipes */
.pipewrap{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0;flex-wrap:nowrap}
.pipegrid{display:grid;grid-template-columns:repeat(3,min(26vw,92px));gap:4px;background:#2a332e;padding:6px;border-radius:10px;border:2px solid #b87333}
.tile{aspect-ratio:1;background:#1a201c;border:1px solid #3a463f;border-radius:6px;padding:0;overflow:hidden;min-height:60px}
.tile svg{width:100%;height:100%;transition:transform .28s ease}
.srcdot{font-size:11px;color:var(--water);writing-mode:vertical-rl}

  "<p><b>המטרה:</b> לברוח ממקדש הג'ונגל שמאחורי המפל דרך 6 חדרים ו-12 משימות.</p><ol><li>בצעו משימה וגלו <b>קוד</b> (ספרות או צבעים).</li><li>פתחו את <b>התיבה</b> בקוד וקחו את <b>המפתח</b>.</li><li>השתמשו במפתח כדי לפתוח את <b>הדלת</b> לחדר הבא.</li></ol><p>גררו כדי להסתכל סביב (או ◀ ▶). לחצו על חפצים זוהרים, פתקים, תיבות ודלתות. אפשר לקרוא כל פתק במחברת 📖. יש 3 רמזים, כל אחד עולה 30 שניות. ההתקדמות נשמרת אוטומטית.</p>",

 'n8':["האבן הגדולה שוקלת תשע. אזנו את המאזניים בדיוק עם שתי משקולות, ומשהו נסתר מתחתיהן יראה את הצבעים לתיבת הצבעים.","The great stone weighs nine. Balance the scale with exactly two weights, and something hidden beneath it will show the colors for the Color Chest.","La grande pierre pèse neuf. Équilibrez la balance avec exactement deux poids, et quelque chose de caché en dessous montrera les couleurs du coffre à couleurs.","La gran piedra pesa nueve. Equilibra la balanza con exactamente dos pesas y algo oculto debajo mostrará los colores del cofre de colores."],

 'n11':["הקריסטלים מתעוררים בסדר הזה: כחול, ירוק, אדום, סגול, צהוב. הדליקו אותם כך וספרות יזהרו על קיר המערה.","The crystals wake in this order: Blue, Green, Red, Purple, Yellow. Light them so and digits will glow on the cave wall.","Les cristaux s'éveillent dans cet ordre : Bleu, Vert, Rouge, Violet, Jaune. Allumez-les ainsi et des chiffres brilleront sur la paroi.","Los cristales despiertan en este orden: Azul, Verde, Rojo, Morado, Amarillo. Enciéndelos así y brillarán dígitos en la pared."],

/* ============ ENGINE ============ */
let LANG = 'he';
const langHooks = [];
function t(key, vars){
  const e = T[key];
  let s = e ? (e[LANGS.indexOf(LANG)] || e[1] || key) : key;
  if(vars) s = s.replace(/\{(\w+)\}/g,(m,k)=> k in vars ? vars[k] : m);
  return s;
}
function applyLang(){
  const root=document.documentElement;
  root.lang = LANG; root.dir = LANG==='he' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=t(el.getAttribute('data-i18n'));
    if(/<[a-z]/.test(v)) el.innerHTML=v; else el.textContent=v;
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title=t(el.getAttribute('data-i18n-title')); });
  const ln=document.getElementById('langName'); if(ln) ln.textContent=LANG_NAMES[LANG];
  langHooks.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } });
}
function setLang(l){
  if(!LANGS.includes(l)) return;
  LANG=l;
  const st=jget('jungleEscape.settings',{}); st.lang=l; jset('jungleEscape.settings',st);
  applyLang();
}
// build one language menu entry per language
function buildLangMenu(){
  const m=document.getElementById('langMenu'); m.innerHTML='';
  LANGS.forEach(l=>{

const AU = {

(function loadVol(){
  const s=jget('jungleEscape.settings',{});
  ['master','music','fx','voice'].forEach(k=>{ if(typeof s[k]==='number') AU.vol[k]=s[k]; });
  AU.muted=!!s.muted;
})();
function saveVol(){
  const s=jget('jungleEscape.settings',{}); Object.assign(s,AU.vol,{muted:AU.muted}); jset('jungleEscape.settings',s);
}
function applyVol(){
  if(!AU.ctx) return; const c=AU.ctx, n=c.currentTime;
  AU.master.gain.setTargetAtTime(AU.muted?0:AU.vol.master,n,.05);
  AU.musicBus.gain.setTargetAtTime(AU.vol.music*.9,n,.05);
  AU.fxBus.gain.setTargetAtTime(AU.vol.fx,n,.05);
}
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume(); return; }

  const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; AU.master.disconnect(); AU.master.connect(comp); comp.connect(c.destination);
  AU.musicBus=c.createGain(); AU.musicBus.connect(AU.master);

function noiseSrc(){ const s=AU.ctx.createBufferSource(); s.buffer=AU.noiseBuf; s.loop=true; s.loopStart=0; s.start(0,Math.random()*3); return s; }
function mkLayer(type,freq,q,gain,dest,lfoRate,lfoDepth){
  const c=AU.ctx, s=noiseSrc(), f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;

function buildLayers(){
  const c=AU.ctx, L=AU.layers;

  L.wfMid  = mkLayer('bandpass',1800,.45,.55,null,.31,.03);
  L.wfHiss = mkLayer('highpass',4500,.5,.22,null,.23,.015); // spray
  L.river  = mkLayer('bandpass',520,2.2,.5,null,.6,.05);   // gurgle

const ROOM_MIX = [
  {wf:1.0, river:0,  wind:.55, leaves:.7, tension:.2, echo:0},
  {wf:.22, river:0,  wind:.7,  leaves:1,  tension:.35,echo:0},
  {wf:.3,  river:.9, wind:.3,  leaves:.5, tension:.5, echo:0},
  {wf:.04, river:0,  wind:.12, leaves:.1, tension:.65,echo:.5},
  {wf:.06, river:0,  wind:.05, leaves:0,  tension:.8, echo:1},
  {wf:1.0, river:0,  wind:.4,  leaves:.6, tension:1,  echo:0}

function setAmbience(room){

  const set=(l,v)=>l.g.gain.setTargetAtTime(v*l.base,n,k);

/* ---- scheduled sounds: taiko drums, jungle animals, drips ---- */
let nextDrum=0, nextAnimal=0, nextDrip=0, drumStep=0, nextEerie=0;
function tickAudio(){
  if(!AU.ready||AU.ctx.state!=='running') return;
  const t=AU.ctx.currentTime, I=AU.intensity, beat=1.45-.75*I;
  if(t>nextDrum){
    drumHit(t, 1);
    if(I>.45 && drumStep%4===2) drumHit(t+beat*.5,.5);
    if(I>.8 && drumStep%2===1) drumHit(t+beat*.25,.4);
    drumStep++; nextDrum=t+beat;
  }
  if(t>nextAnimal){ const r=Math.random(); if(r<.4) bird(t); else if(r<.65) monkey(t); else if(r<.9) frog(t); else bird(t); nextAnimal=t+3+Math.random()*7; }
  if(AU.dripOn && t>nextDrip){ drip(t); nextDrip=t+1.2+Math.random()*3.2; }
  if(I>.3 && t>nextEerie){ eerie(t); nextEerie=t+9+Math.random()*10; }
}

  const c=AU.ctx, o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(42,t+.22);

  const n=noiseSrc(), f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=300; const ng=c.createGain(); ng.gain.setValueAtTime(.25*v,t); ng.gain.exponentialRampToValueAtTime(.001,t+.08);

}
function eerie(t){
  const c=AU.ctx, f=[392,311.1,466.2,349.2][Math.floor(Math.random()*4)]*.5, o=c.createOscillator(), g=c.createGain(), l=c.createOscillator(), lg=c.createGain();

}
function tone(freq,dur,type,vol,when,dest,slide){
  if(!AU.ready) return; const c=AU.ctx, t=(when||c.currentTime), o=c.createOscillator(), g=c.createGain();

function burst(dur,type,freq,q,vol,when,dest){
  if(!AU.ready) return; const c=AU.ctx, t=when||c.currentTime, s=noiseSrc(), f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q||1;

function bird(t){ const n=2+Math.floor(Math.random()*3), base=2200+Math.random()*1800; for(let i=0;i<n;i++) tone(base,.12,'sine',.025,t+i*.16,AU.ambBus,base*1.5); }

/* ---- toast / flash / fade ---- */
let toastTimer=null;
function toast(msg,bad,ms){ const el=document.getElementById('toast'); el.textContent=msg; el.className='on'+(bad?' bad':''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.className=''; },ms||3200); }
function flash(kind){ const f=document.getElementById('flash'); f.className=''; void f.offsetWidth; f.className=kind; }
function fadeTo(on){ document.getElementById('fade').classList.toggle('on',!!on); }

/* ---- modal ---- */
let curModal=null;
function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function openModal(o){
  const m=document.getElementById('modal'); ttsStop(); curModal=o;
  document.getElementById('mtitle').textContent=o.title||'';
  document.getElementById('mcard').classList.toggle('wide',!!o.wide);
  const body=document.getElementById('mbody'); body.innerHTML=''; if(typeof o.body==='string') body.innerHTML=o.body; else if(o.body) body.appendChild(o.body);
  const foot=document.getElementById('mfoot'); foot.innerHTML='';
  if(o.read){ const say=el('div','say'); const b=el('button','btn'); b.textContent=t('u.read'); b.id='readBtn'; b.onclick=()=>ttsToggle(b,o.read); say.appendChild(b);
    const v=document.createElement('input'); v.type='range'; v.min=0; v.max=100; v.value=Math.round(AU.vol.voice*100); v.title=t('u.vol'); v.setAttribute('aria-label',t('u.vol')); v.oninput=()=>{ AU.vol.voice=v.value/100; ttsVolume(); document.getElementById('vVoice').value=v.value; saveVol(); }; say.appendChild(v); foot.appendChild(say); }
  (o.foot||[]).forEach(f=>foot.appendChild(f));
  document.getElementById('mclose').style.display=o.noClose?'none':'';
  const mh=document.getElementById('mhint'); mh.hidden=true; mh.textContent='';
  if(o.hintBtn){ const hb=btn('💡 '+t('b.hint'),'',()=>useHint()); hb.id='footHint'; hb.style.flex='0 0 auto'; foot.insertBefore(hb,foot.firstChild); }
  m.hidden=false; document.getElementById('mbody').scrollTop=0; if(o.onOpen) o.onOpen(); uiModalOpened();
}

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();

  const list=curRoom.hot.filter(h=>h.obj.visible&&h.enabled());

}

/* ---- main loop ---- */
let T0=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,clock.getDelta()); T0+=dt; SH.time.value=T0;
  for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; tw.t+=dt; const p=Math.min(1,tw.t/tw.dur); tw.fn(p); if(p>=1){ tweens.splice(i,1); if(tw.done) tw.done(); } }
  if(curRoom){
    if(mode==='lobby'){ yaw=curRoom.startYaw*RAD+Math.sin(T0*.12)*.7; pitch=.04+Math.sin(T0*.2)*.03; }
    else if(navDir&&document.getElementById('modal').hidden) yaw+=navDir*1.5*dt;
    camera.rotation.y=-yaw; camera.rotation.x=pitch;
    camera.position.y=(camera.userData.baseY||1.65)+Math.sin(T0*1.3)*.012; if(camShake>0){ camShake-=dt; camera.position.x=(Math.random()-.5)*.05*camShake*4; } else if(!busy) camera.position.x=0;
    curRoom.upd.forEach(f=>f(T0,dt));
    animateObjects(dt);
    if(mode==='game'&&!busy&&document.getElementById('hud').hidden===false){ S.time+=dt; hudTimer+=dt; elapsedSinceSave+=dt; if(hudTimer>.5){ hudTimer=0; document.getElementById('cTime').textContent=fmtTime(S.time); } if(elapsedSinceSave>=5){ elapsedSinceSave=0; saveGame(); } }
    if(renderer) renderer.render(curRoom.scene,camera);
  }
}
function angDiff(a,b){ let d=a-b; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI; return d; }
function animateObjects(dt){

    const ch=R.chests[id], target=S.chests[id]?1:0; if(Math.abs(ch.openAmt-target)>.002){ ch.setLid(ch.openAmt+(target-ch.openAmt)*Math.min(1,dt*2.4)); }
    const pos=ch.group.position, ang=Math.atan2(pos.x,-pos.z), near=Math.max(0,1-Math.abs(angDiff(ang,yaw))/.7);
    const pulse=.5+.5*Math.sin(T0*3);

    ch.lock.material.opacity=.6+.4*near; ch.lock.position.y=1.45+Math.sin(T0*2)*.05;
    if(ch.shake>0){ ch.shake-=dt; ch.inner.position.x=Math.sin(ch.shake*70)*.06*Math.min(1,ch.shake*3); if(ch.shake<=0) ch.inner.position.x=0; }
    if(ch.keyMesh){ ch.keyMesh.rotation.y+=dt*1.6; ch.keyMesh.position.y=.2+Math.min(1,ch.openAmt)*.95+Math.sin(T0*2.4)*.06; }
  });

    const target=S.doors.includes(R.doorIdx)?1:0; if(Math.abs(dr.openAmt-target)>.002){ dr.setOpen(dr.openAmt+Math.sign(target-dr.openAmt)*Math.min(Math.abs(target-dr.openAmt),dt*.3)); }
    if(dr.shake>0){ dr.shake-=dt; dr.group.children.forEach(c=>{ c.position.x+=0; }); dr.slab.position.x=Math.sin(dr.shake*60)*.07; if(dr.shake<=0) dr.slab.position.x=0; }

  }
}

/* ---- Mission 10: maze of vines ---- */
function genMaze(cw,ch,seed){
  const r=rng(seed), W=cw*2+1, H=ch*2+1, g=Array.from({length:H},()=>Array(W).fill(1)), vis=new Set(['0,0']), st=[[0,0]]; g[1][1]=0;
  while(st.length){ const [cx,cy]=st[st.length-1]; const ds=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>{ const nx=cx+dx,ny=cy+dy; return nx>=0&&ny>=0&&nx<cw&&ny<ch&&!vis.has(nx+','+ny); });
    if(!ds.length){ st.pop(); continue; } const [dx,dy]=ds[Math.floor(r()*ds.length)], nx=cx+dx, ny=cy+dy; g[cy*2+1+dy][cx*2+1+dx]=0; g[ny*2+1][nx*2+1]=0; vis.add(nx+','+ny); st.push([nx,ny]); }
  return g;
}

  }
  function loop(){ if(!alive) return; if(running&&!done){ const el=(performance.now()-t0)/1000; barI.style.width=Math.max(0,(1-el/LIMIT)*100)+'%'; if(el>=LIMIT) fail(t('m10.time')); } draw(); requestAnimationFrame(loop); }
  const pos=e=>{ const r=cvs.getBoundingClientRect(); return {x:(e.clientX-r.left)*cvs.width/r.width,y:(e.clientY-r.top)*cvs.height/r.height}; };
